<style>

  .dots { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; transition: background 0.2s; cursor: pointer; }

  .thumbs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }

<body>
<div class="wrap">

      <div class="thumb on"><img src="https://drive.google.com/thumbnail?id=1iYErnb20nboHNyrzEhQ9N_f6aVRhHRm8&sz=w200" alt="1"></div>

      <div class="thumb"><img src="https://drive.google.com/thumbnail?id=1FjKYsEW8wxFvK3Xj9GG4Tz8gMV4aAlbC&sz=w200" alt="5"></div>
      <div class="thumb"><img src="https://drive.google.com/thumbnail?id=1gSrAEtdDxmoOP_1SRhvE0m8JIcbaq01P&sz=w200" alt="6"></div>

<script>
  const imgs = [
    'https://drive.google.com/thumbnail?id=1iYErnb20nboHNyrzEhQ9N_f6aVRhHRm8&sz=w1000',
    'https://drive.google.com/thumbnail?id=1VgWkU0j0F0JkNZIrUrxWtuEYKKEr7XTQ&sz=w1000',
    'https://drive.google.com/thumbnail?id=1CUwYA7jCBLdD7tcHzdw9jGNR8GDZyy1_&sz=w1000',
    'https://drive.google.com/thumbnail?id=1ktdKIr7FM5EGdySUW_SAKRejzztWhY3-&sz=w1000',
    'https://drive.google.com/thumbnail?id=1FjKYsEW8wxFvK3Xj9GG4Tz8gMV4aAlbC&sz=w1000',
    'https://drive.google.com/thumbnail?id=1gSrAEtdDxmoOP_1SRhvE0m8JIcbaq01P&sz=w1000'
  ];
  let cur = 0;
  const mainImg = document.getElementById('main-img');
  const dots = document.querySelectorAll('#dots .dot');
  const thumbs = document.querySelectorAll('#thumbs .thumb');

  function go(n) {
    cur = (n + imgs.length) % imgs.length;
    mainImg.src = imgs[cur];
    dots.forEach((d, i) => d.classList.toggle('on', i === cur));
    thumbs.forEach((t, i) => t.classList.toggle('on', i === cur));
    thumbs[cur].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
  }

  document.getElementById('prev-btn').addEventListener('click', () => go(cur - 1));
  document.getElementById('next-btn').addEventListener('click', () => go(cur + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));
  thumbs.forEach((t, i) => t.addEventListener('click', () => go(i)));
</script>
